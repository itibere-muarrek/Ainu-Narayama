name: CI

# Não faz deploy — Render redesploya sozinho a cada push (ver
# render.yaml). Este workflow só valida que o código ainda importa
# corretamente e que os dados de referência (28 países) continuam
# consistentes antes de qualquer push chegar ao Render.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install -r app/requirements.txt

      - name: Checagem de regressão (28 países, config/CSV sincronizados)
        run: |
          python -c "
          import pandas as pd
          from src.config import PAISES
          from src.indices import calcular_ngii_obs, calcular_fator_geracional, calcular_n_base, classificar_zona_5, normalizar_n_base

          assert len(PAISES) == 28, f'esperado 28 paises, encontrado {len(PAISES)}'

          df = pd.read_csv('docs/paises_perfil.csv')
          assert set(df['codigo']) == set(PAISES.keys()), 'docs/paises_perfil.csv e src/config.py divergem'

          ngii_obs = calcular_ngii_obs(65.0, 110.0, 2.7, 1.6)
          n = calcular_n_base(ngii_obs, calcular_fator_geracional(1.60, 2.40))
          n_estrela = normalizar_n_base(n)
          assert n_estrela is not None and n_estrela > 0, 'normalizar_n_base falhou'
          classificar_zona_5(n)

          print('Checagem de regressão: OK')
          "

      - name: Checagem de regressão (série histórica, quinquenal)
        run: |
          python -c "
          from src.config import ANOS_ALVO_HISTORICO, PAISES
          from src.data_pipeline import executar_pipeline_historico

          df = executar_pipeline_historico()
          assert len(df) == len(PAISES) * len(ANOS_ALVO_HISTORICO), f'esperado {len(PAISES) * len(ANOS_ALVO_HISTORICO)} linhas, encontrado {len(df)}'
          assert df['n_base'].notna().all(), 'n_base com valores nulos na serie historica'
          assert df['n_estrela'].notna().all(), 'n_estrela com valores nulos na serie historica'

          print('Checagem de regressão (histórico): OK')
          "

      - name: Checagem de regressão (P_2.1/P_eq, convergência)
        run: |
          python -c "
          import pandas as pd
          from src.config import PAISES

          df = pd.read_csv('data/raw/convergencia_un.csv')
          assert len(df) == len(PAISES), f'esperado {len(PAISES)} linhas, encontrado {len(df)}'
          assert set(df['pais_codigo']) == set(PAISES.keys()), 'convergencia_un.csv e src/config.py divergem'
          assert df['p_eq'].notna().all(), 'p_eq com valores nulos'
          assert (df['p_eq'] > 0).all(), 'p_eq com valores nao positivos'
          assert df['p_tendencia'].notna().all(), 'p_tendencia com valores nulos'
          assert (df['p_tendencia'] > 0).all(), 'p_tendencia com valores nao positivos'

          print('Checagem de regressão (convergência): OK')
          "

      - name: Testes PQDF-N* (F1 reprodutibilidade; F4 informativo)
        run: |
          python scripts/testes_pqdf.py > /dev/null
          python -c "
          import json
          r = json.load(open('docs/testes_pqdf_n_estrela.json', encoding='utf-8'))
          assert r['F1']['resultado'] == 'passa', 'F1 (reprodutibilidade) falhou'
          print('F1:', r['F1']['resultado'], '| F4:', r['F4']['resultado'])
          "

      - name: Rodar teste de cálculo (Brasil, informativo)
        run: python test_calculo_brasil.py
