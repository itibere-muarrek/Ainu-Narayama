# Blueprint do Render (https://render.com/docs/blueprint-spec).
#
# Cada site público (ainu.systems, narayama.live) agora é composto por
# DOIS serviços Render:
#   1. Uma landing page estática (HTML puro) na raiz do domínio —
#      existe pra ser indexável pelos motores de busca (Streamlit é
#      renderizado via JS e não é indexável).
#   2. O app Streamlit interativo de sempre, sem domínio customizado —
#      fica na URL gratuita do próprio Render (ex.:
#      ainu-systems.onrender.com). Decisão de 2026-07-30: o plano
#      gratuito do Render só inclui 2 domínios customizados por conta
#      (não por serviço); usar subdomínio "app." nos 2 sites exigiria
#      4 domínios (2 pagos, ~US$0,50/mês) — evitado atribuindo os 2
#      domínios customizados gratuitos só às landing pages.
#
# Domínios customizados são configurados manualmente no painel do
# Render após o deploy (ver README.md, seção "Deploy") — ainu.systems
# vai pro serviço "ainu-systems-landing", narayama.live vai pro
# "narayama-live-landing". Os 2 serviços Streamlit ficam sem domínio
# customizado.
#
# Render redesploya automaticamente a cada push para a branch
# conectada; não é necessário workflow de deploy no GitHub Actions.

services:
  - type: web
    name: ainu-systems
    runtime: python
    plan: free
    buildCommand: pip install -r app/requirements.txt
    startCommand: streamlit run app/ainu_systems/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: AINU_SYSTEMS_PASSWORD
        sync: false

  - type: web
    name: narayama-live
    runtime: python
    plan: free
    buildCommand: pip install -r app/requirements.txt
    startCommand: streamlit run app/narayama_live/app.py --server.port $PORT --server.address 0.0.0.0

  - type: web
    name: ainu-systems-landing
    runtime: static
    plan: free
    staticPublishPath: ./landing/ainu-systems
    buildCommand: ""

  - type: web
    name: narayama-live-landing
    runtime: static
    plan: free
    staticPublishPath: ./landing/narayama-live
    buildCommand: ""
